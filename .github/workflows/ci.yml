name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.0'
  JAVA_VERSION: '21'
  APK_NAME: aivos-arm64-v8a.apk

jobs:
  analyze:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos

      - run: flutter test

  build-apk:
    name: Build APK (arm64-v8a)
    needs: analyze
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK will be debug-signed."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/aivos-release.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=aivos-release.jks
          EOF

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename the artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/$APK_NAME"

      - name: Verify the APK contains only arm64-v8a
        run: |
          unzip -l "build/app/outputs/flutter-apk/$APK_NAME" | grep -q 'lib/arm64-v8a/'
          if unzip -l "build/app/outputs/flutter-apk/$APK_NAME" | grep -qE 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "Unexpected ABI found in the APK" >&2
            exit 1
          fi
          echo "APK contains arm64-v8a only."

      - uses: actions/upload-artifact@v4
        with:
          name: aivos-apk-arm64-v8a
          path: build/app/outputs/flutter-apk/${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish a release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'nightly' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: build/app/outputs/flutter-apk/${{ env.APK_NAME }}
          body: |
            AIVOS for Android, **arm64-v8a** only (64-bit phones, e.g. Galaxy S21).

            Install the `aivos-arm64-v8a.apk` file below on your phone.

            Built from `${{ github.sha }}`.
