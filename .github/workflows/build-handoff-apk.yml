name: Build Handoff APK

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: handoff-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: arm64 release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Read version
        id: version
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//' | tr -d '[:space:]')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - name: Fetch packages
        run: flutter pub get

      - name: Analyse
        run: flutter analyze lib

      # A release APK with no signing config is left unsigned and Android
      # refuses to install it, so restore the keystore from secrets.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set, the APK would be unsigned"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/handoff-release.p12
          cat > android/key.properties <<EOF
          storeFile=../handoff-release.p12
          storePassword=$STORE_PASSWORD
          keyAlias=handoff
          keyPassword=$STORE_PASSWORD
          EOF

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify ABI and signature
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          # lib/ also holds asset folders such as lib/katex_fonts, so match
          # only the names Android treats as ABIs.
          ABIS=$(unzip -l "$APK" | grep -oE 'lib/(armeabi-v7a|x86|x86_64|arm64-v8a|mips|mips64)/' | sort -u || true)
          echo "ABIs in the APK:"
          echo "$ABIS"
          if [ "$ABIS" != "lib/arm64-v8a/" ]; then
            echo "::error::expected arm64-v8a only, got: $ABIS"
            exit 1
          fi
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          echo "arm64-only APK, signed"

      - name: Name the artifact
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk \
             "out/handoff-${{ steps.version.outputs.name }}-arm64.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: handoff-apk-arm64
          path: out/*.apk
          retention-days: 30
